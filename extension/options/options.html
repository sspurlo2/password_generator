<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Password Tool Options</title>
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <main class="container">
      <div class="header">
        <h1>Password Tool Options</h1>

        <!-- From Uiverse.io by andrew-demchenk0 --> 
        <label class="switch" id="switch">
          <span class="sun"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><g fill="#ffd43b"><circle r="5" cy="12" cx="12"></circle><path d="m21 13h-1a1 1 0 0 1 0-2h1a1 1 0 0 1 0 2zm-17 0h-1a1 1 0 0 1 0-2h1a1 1 0 0 1 0 2zm13.66-5.66a1 1 0 0 1 -.66-.29 1 1 0 0 1 0-1.41l.71-.71a1 1 0 1 1 1.41 1.41l-.71.71a1 1 0 0 1 -.75.29zm-12.02 12.02a1 1 0 0 1 -.71-.29 1 1 0 0 1 0-1.41l.71-.66a1 1 0 0 1 1.41 1.41l-.71.71a1 1 0 0 1 -.7.24zm6.36-14.36a1 1 0 0 1 -1-1v-1a1 1 0 0 1 2 0v1a1 1 0 0 1 -1 1zm0 17a1 1 0 0 1 -1-1v-1a1 1 0 0 1 2 0v1a1 1 0 0 1 -1 1zm-5.66-14.66a1 1 0 0 1 -.7-.29l-.71-.71a1 1 0 0 1 1.41-1.41l.71.71a1 1 0 0 1 0 1.41 1 1 0 0 1 -.71.29zm12.02 12.02a1 1 0 0 1 -.7-.29l-.66-.71a1 1 0 0 1 1.36-1.36l.71.71a1 1 0 0 1 0 1.41 1 1 0 0 1 -.71.24z"></path></g></svg></span>
          <span class="moon"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 384 512"><path d="m223.5 32c-123.5 0-223.5 100.3-223.5 224s100 224 223.5 224c60.6 0 115.5-24.2 155.8-63.4 5-4.9 6.3-12.5 3.1-18.7s-10.1-9.7-17-8.5c-9.8 1.7-19.8 2.6-30.1 2.6-96.9 0-175.5-78.8-175.5-176 0-65.8 36-123.1 89.3-153.3 6.1-3.5 9.2-10.5 7.7-17.3s-7.3-11.9-14.3-12.5c-6.3-.5-12.6-.8-19-.8z"></path></svg></span>   
          <input type="checkbox" class="input">
          <span class="slider"></span>
        </label>
      </div>

      <section class="card">
        <h2>Word Bank</h2>
        <p class="muted">
          Paste words separated by commas or new lines. This word bank is used for
          <b>Passphrase (memorable)</b> mode in the popup.
        </p>

        <div class="row">
          <label for="wordBankInput">Your custom word bank</label>
          <textarea
            id="wordBankInput"
            rows="10"
            placeholder="e.g.
river
cactus
orbit
laptop
sunset
(or comma-separated: river, cactus, orbit...)"
          ></textarea>
        </div>

        <div class="actions">
          <button id="saveBtn">Save Word Bank</button>
          <button id="resetBtn" class="secondary">Reset to Default</button>
          <button id="previewBtn" class="secondary">Preview Generate</button>
          <label>
            <input id="mixed_bank" type="checkbox" checked />
              Use Defined Word Bank & Dictionary
          </label>
        </div>

        <div id="statusMsg" class="status" aria-live="polite"></div>

        <div class="row">
          <label>Preview</label>
          <div id="previewOut" class="preview">Preview will appear here.</div>
        </div>
      </section>

      <footer class="footer">
        <a href="../popup/popup.html" target="_blank" rel="noreferrer" class="button">Open Popup</a>
      </footer>
    </main>

    <script type="module" src="options.js"></script>
  </body>
</html>
